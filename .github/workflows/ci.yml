name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  reference-tests:
    name: Referenztests (brother_ql, byteweise)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testsuite ausfuehren
        run: bash tools/run_tests.sh

  apk-build:
    name: APK-Build (Kompilierbarkeit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: SDK-Lizenzen akzeptieren und Komponenten installieren
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0" >/dev/null
      - name: build.sh ausfuehren
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0" \
          AJ="$ANDROID_HOME/platforms/android-35/android.jar" \
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ci-apk
          path: QL-Druckdienst.apk
          retention-days: 7
