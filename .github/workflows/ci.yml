name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  reference-tests:
    name: Referenztests (brother_ql, byteweise)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testsuite ausfuehren
        run: bash tools/run_tests.sh

  apk-build:
    name: APK-Build (Kompilierbarkeit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK-Komponenten installieren
        run: |
          # ubuntu-latest bringt das Android SDK vorinstalliert mit
          ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;34.0.0" >/dev/null
      - name: build.sh ausfuehren
        run: |
          BT=/usr/local/lib/android/sdk/build-tools/34.0.0 \
          AJ=/usr/local/lib/android/sdk/platforms/android-35/android.jar \
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ci-apk
          path: QL-Druckdienst.apk
          retention-days: 7
